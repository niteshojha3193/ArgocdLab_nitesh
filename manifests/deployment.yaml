apiVersion: apps/v1
kind: Deployment
metadata: 
  name: netflix-deploy
spec: 
  replicas: 3
  selector: 
    matchLabels: 
      app: netflix
  template:
    metadata:
      labels: 
        app: netflix
    spec:
      containers:
       - name: netflix
         image: shailesh49/netflix
         ports: 
         - containerPort: 80
